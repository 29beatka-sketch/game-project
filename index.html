<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <title>VR Whack-a-Mole Game</title>
</head>
<body>
    <a-scene background="color: #87CEEB" vr-mode-ui="enabled: true">
        <!-- Assets -->
        <a-assets>
            <a-mixin id="mole-mixin" 
                     animation__popup="property: position; to: 0 1 0; dur: 500; startEvents: popup"
                     animation__hide="property: position; to: 0 -0.5 0; dur: 300; startEvents: hide"
                     class="clickable">
            </a-mixin>
        </a-assets>

        <!-- Lighting -->
        <a-light type="ambient" color="#404040"></a-light>
        <a-light type="directional" position="0 10 5" color="#ffffff"></a-light>

        <!-- Ground -->
        <a-plane position="0 0 -4" rotation="-90 0 0" width="10" height="10" color="#228B22"></a-plane>

        <!-- Game Elements -->
        <!-- Mole holes (9 positions in a 3x3 grid) -->
        <a-cylinder id="hole1" position="-2 0 -2" radius="0.6" height="10" color="#black"></a-cylinder>
        <a-cylinder id="hole2" position="0 -0.1 -2" radius="0.6" height="0.1" color="#8B4513"></a-cylinder>
        <a-cylinder id="hole3" position="2 -0.1 -2" radius="0.6" height="0.1" color="#8B4513"></a-cylinder>
        <a-cylinder id="hole4" position="-2 -0.1 -4" radius="0.6" height="0.1" color="#8B4513"></a-cylinder>
        <a-cylinder id="hole5" position="0 -0.1 -4" radius="0.6" height="0.1" color="#8B4513"></a-cylinder>
        <a-cylinder id="hole6" position="2 -0.1 -4" radius="0.6" height="0.1" color="#8B4513"></a-cylinder>
        <a-cylinder id="hole7" position="-2 -0.1 -6" radius="0.6" height="0.1" color="#8B4513"></a-cylinder>
        <a-cylinder id="hole8" position="0 -0.1 -6" radius="0.6" height="0.1" color="#8B4513"></a-cylinder>
        <a-cylinder id="hole9" position="2 -0.1 -6" radius="0.6" height="0.1" color="#8B4513"></a-cylinder>

        <!-- Moles (boxes and spheres) -->
        <a-box id="mole1" mixin="mole-mixin" position="-2 -0.5 -2" width="0.8" height="0.8" depth="0.8" color="#8B4513"></a-box>
        <a-sphere id="mole2" mixin="mole-mixin" position="0 -0.5 -2" radius="0.4" color="#654321"></a-sphere>
        <a-box id="mole3" mixin="mole-mixin" position="2 -0.5 -2" width="0.8" height="0.8" depth="0.8" color="#8B4513"></a-box>
        <a-sphere id="mole4" mixin="mole-mixin" position="-2 -0.5 -4" radius="0.4" color="#654321"></a-sphere>
        <a-box id="mole5" mixin="mole-mixin" position="0 -0.5 -4" width="0.8" height="0.8" depth="0.8" color="#8B4513"></a-box>
        <a-sphere id="mole6" mixin="mole-mixin" position="2 -0.5 -4" radius="0.4" color="#654321"></a-sphere>
        <a-box id="mole7" mixin="mole-mixin" position="-2 -0.5 -6" width="0.8" height="0.8" depth="0.8" color="#8B4513"></a-box>
        <a-sphere id="mole8" mixin="mole-mixin" position="0 -0.5 -6" radius="0.4" color="#654321"></a-sphere>
        <a-box id="mole9" mixin="mole-mixin" position="2 -0.5 -6" width="0.8" height="0.8" depth="0.8" color="#8B4513"></a-box>

        <!-- Score display -->
        <a-text id="scoreText" position="0 3 -3" align="center" value="Score: 0" color="black" scale="2 2 2"></a-text>

        <!-- Camera with cursor for clicking/gazing -->
        <a-camera>
            <a-cursor position="0 0 -1"
                      geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                      material="color: red; shader: flat"
                      raycaster="objects: .clickable"
                      animation__click="property: scale; startEvents: click; from: 0.1 0.1 0.1; to: 1 1 1; dur: 150"
                      animation__fusing="property: fusing; startEvents: fusing; from: 1 1 1; to: 0.1 0.1 0.1; dur: 1500">
            </a-cursor>
        </a-camera>
    </a-scene>

    <script>
        // Game variables
        let score = 0;
        let gameActive = true;
        const moles = [];
        const scoreText = document.querySelector('#scoreText');

        // Get all mole elements
        for (let i = 1; i <= 9; i++) {
            moles.push(document.querySelector(`#mole${i}`));
        }

        // Add click event listeners to moles
        moles.forEach((mole, index) => {
            mole.addEventListener('click', function() {
                hitMole(index);
            });
        });

        // Function to handle mole hits
        function hitMole(moleIndex) {
            const mole = moles[moleIndex];
            
            // Only count if mole is currently up (y position > 0)
            const currentPos = mole.getAttribute('position');
            if (currentPos.y > 0) {
                score += 10;
                scoreText.setAttribute('value', `Score: ${score}`);
                
                // Hide the mole immediately
                mole.emit('hide');
                
                // Flash effect
                mole.setAttribute('color', 'yellow');
                setTimeout(() => {
                    if (mole.tagName === 'A-BOX') {
                        mole.setAttribute('color', '#8B4513');
                    } else {
                        mole.setAttribute('color', '#654321');
                    }
                }, 200);
            }
        }

        // Function to show random mole
        function showRandomMole() {
            if (!gameActive) return;
            
            const randomIndex = Math.floor(Math.random() * moles.length);
            const mole = moles[randomIndex];
            
            // Only show if mole is currently hidden
            const currentPos = mole.getAttribute('position');
            if (currentPos.y <= 0) {
                mole.emit('popup');
                
                // Hide mole after 2 seconds if not hit
                setTimeout(() => {
                    const pos = mole.getAttribute('position');
                    if (pos.y > 0) {  // Still up
                        mole.emit('hide');
                    }
                }, 2000);
            }
        }

        // Start the game
        function startGame() {
            // Show moles at random intervals
            setInterval(showRandomMole, 1500);
        }

        // Wait for scene to load then start game
        document.querySelector('a-scene').addEventListener('loaded', () => {
            setTimeout(startGame, 2000); // Start after 2 seconds
        });
    </script>
</body>
</html>
